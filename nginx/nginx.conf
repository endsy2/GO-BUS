# ─────────────────────────────────────────────────────────────────────────────
#  Go Bus Express — nginx reverse proxy (single origin, plain HTTP on port 80)
#
#  Everything is served from ONE origin (http://<VPS_IP>/) so the browser makes
#  same-origin requests — no CORS, no preflight.
#
#    /api/...                  -> gateway-service:8080   (REST API)
#    /actuator/...             -> gateway-service:8080   (health, optional)
#    /bus-service/ws/...       -> gateway-service:8080   (SockJS/WebSocket)
#    /booking-service/ws/...   -> gateway-service:8080   (SockJS/WebSocket)
#    /admin/ws/...             -> gateway-service:8080   (SockJS/WebSocket)
#    /  (everything else)      -> admin-frontend:3000    (React SPA)
# ─────────────────────────────────────────────────────────────────────────────

events {
    worker_connections 1024;
}

http {
    # SockJS/WebSocket upgrade handling
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream gateway {
        server gateway-service:8080;
    }

    upstream admin {
        server admin-frontend:3000;
    }

    # Allow large-ish uploads (profile images, report exports, etc.)
    client_max_body_size 25m;

    # Don't leak the nginx version
    server_tokens off;

    server {
        listen 80;
        server_name _;

        # ── REST API ──────────────────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Bakong QR top-up polling can take up to 5 minutes — the gateway has a
            # 310s response timeout, so nginx must wait at least as long.
            proxy_connect_timeout 10s;
            proxy_send_timeout    320s;
            proxy_read_timeout    320s;
        }

        # ── Actuator health (optional; handy for debugging) ───────────────────
        location /actuator/ {
            proxy_pass       http://gateway;
            proxy_set_header Host $host;
        }

        # ── WebSocket / SockJS endpoints ──────────────────────────────────────
        location /bus-service/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /booking-service/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /admin/ws/ {
            proxy_pass         http://gateway;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_buffering    off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Admin SPA (React) — must be last (catch-all) ──────────────────────
        location / {
            proxy_pass       http://admin;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
