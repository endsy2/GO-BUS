plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.busapp'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    springCloudVersion = '2023.0.3'
}

dependencyManagement {
    imports {
        // ONLY import Spring Cloud BOM - remove Spring Boot BOM
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

// Spring Cloud Gateway uses WebFlux (reactive); exclude servlet-based web if pulled in transitively
configurations.all {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-web'
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
}

dependencies {
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    // Structured (JSON / key-value) logging + StructuredArguments.kv(...)
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
    runtimeOnly     'io.jsonwebtoken:jjwt-impl:0.12.5'
    runtimeOnly     'io.jsonwebtoken:jjwt-jackson:0.12.5'
    // Resilience4j – circuit breaker, retry, time-limiter for Spring Cloud Gateway (WebFlux)
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'
    // Resilience4j – rate limiter module (in-memory, per-key token bucket)
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation  'org.springframework.boot:spring-boot-starter-test'
}

test {
    useJUnitPlatform()
}

bootJar {
    enabled = true
    archiveFileName = "gateway-service.jar"
}

jar {
    enabled = false
}