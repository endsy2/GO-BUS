# ─────────────────────────────────────────────────────────────────────────────
#  API Gateway — DEVELOPMENT profile (active by default)
#
#  Every value has a localhost default, so the gateway runs from the IDE with
#  no setup. docker-compose.dev.yml overrides the hosts with container names.
# ─────────────────────────────────────────────────────────────────────────────

# ── Downstream services (used by the routes in application.yml) ───────────────
downstream:
  user-service: ${USER_SERVICE_URL:http://localhost:8081}
  bus-service: ${BUS_SERVICE_URL:http://localhost:8082}
  booking-service: ${BOOKING_SERVICE_URL:http://localhost:8083}
  bus-service-ws: ${BUS_SERVICE_WS_URL:ws://localhost:8082}
  booking-service-ws: ${BOOKING_SERVICE_WS_URL:ws://localhost:8083}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ── JWT Configuration ──────────────────────────────────────────────────────────
# DEV-ONLY key. It is public (committed to git), so it must NEVER be used in
# production. It matches the dev private key in user-service/application-dev.yml.
jwt:
  public-key: ${JWT_PUBLIC_KEY:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,circuitbreakerevents,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.busapp.gatewayservice: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    # Suppress Micrometer observation span noise (http.status_code='UNKNOWN' is a
    # known SCG 4.1.x bug — status tag is unset at span-creation time; not a real error)
    org.springframework.cloud.gateway.filter.headers.observation: WARN
    reactor.netty: DEBUG
