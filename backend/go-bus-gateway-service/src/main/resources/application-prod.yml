server:
  port: ${PORT:8080}

# ── CORS Configuration ─────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
  cloud:
    loadbalancer:
      ribbon:
        enabled: false
    gateway:
      # ── HTTP Client Configuration (for long-running requests) ──────────────
      httpclient:
        connect-timeout: 5000      # 5 seconds to establish connection
        response-timeout: 310s     # 5 minutes + 10s buffer for Bakong
        pool:
          type: ELASTIC
          max-connections: 500
          max-idle-time: 30s
      # Disable automatic service discovery for direct URL routing
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      # Explicit named routes (preferred for production)
      routes:

        # ── WebSocket Routes ────────────────────────────────────────────────
        # IMPORTANT: WebSocket routes must come BEFORE HTTP routes to match correctly
        # ── Bakong Topup Service ────────────────────────────────────────────────────
        - id: bakong-topup-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/topups/bakong/**
          filters:
            - name: CircuitBreaker
              args:
                name: bakongServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # ── Bakong Topup Service ────────────────────────────────────────────────────
        - id: bakong-booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/payments/bakong/**
          filters:
            - name: CircuitBreaker
              args:
                name: bakongServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # Bus Service WebSocket - All SockJS endpoints
        - id: bus-websocket
          uri: ${BUS_SERVICE_WS_URL:ws://localhost:8082}
          predicates:
            - Path=/bus-service/ws/bus/**
          filters:
            - RewritePath=/bus-service/ws/bus/(?<segment>.*), /ws/bus/$\{segment}

        # Booking Service WebSocket - All SockJS endpoints
        - id: booking-websocket
          uri: ${BOOKING_SERVICE_WS_URL:ws://localhost:8083}
          predicates:
            - Path=/booking-service/ws/booking/**
          filters:
            - RewritePath=/booking-service/ws/booking/(?<segment>.*), /ws/booking/$\{segment}

        # Admin Dashboard WebSocket
        - id: admin-dashboard-websocket
          uri: ${BOOKING_SERVICE_WS_URL:ws://localhost:8083}
          predicates:
            - Path=/admin/ws/dashboard/**
          filters:
            - RewritePath=/admin/ws/dashboard/(?<segment>.*), /ws/booking/$\{segment}
        # ── Auth (public — no JWT required) ───────────────────────────────────
        - id: auth-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Admin — User Service ───────────────────────────────────────────────
        - id: admin-user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/users/**,/api/admin/roles/**,/api/admin/permissions/**,/api/admin/reports-customer/**,/api/admin/wallets/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── User Service ───────────────────────────────────────────────────────
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**,/api/wallet/**,/api/wallets/**,/api/notifications/**,/api/topups/**,/api/preferences/**,/api/profile/**,
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # ── Bus Service ────────────────────────────────────────────────────────
        - id: bus-service
          uri: ${BUS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/buses/**,/api/routes/**,/api/layouts/**,/api/schedules/**,/api/seats/**,/api/schedule-seats/**
          filters:
            - name: CircuitBreaker
              args:
                name: busServiceCB
                fallbackUri: forward:/fallback/bus-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # ── Admin Bus Service ────────────────────────────────────────────────────────
        - id: admin-bus-service
          uri: ${BUS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/admin/reports-bus
          filters:
            - name: CircuitBreaker
              args:
                name: busServiceCB
                fallbackUri: forward:/fallback/bus-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # ── Admin — Booking Service ────────────────────────────────────────────
        - id: admin-booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/admin/bookings/**,/api/admin/reports-operation/**,/api/admin/financial-reports/**,/api/admin/dashboard/**,/api/admin/refunds/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Booking Service ────────────────────────────────────────────────────
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/bookings/**,/api/payments/**,/api/tickets/**,/api/promos/**,/api/refunds/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false


# ── JWT Configuration ──────────────────────────────────────────────────────────
# Must match jwt.public-key in user-service.
# Set JWT_PUBLIC_KEY in .env (base64-encoded DER, generated by ./generate-keys.sh)
jwt:
  public-key: ${Public_Key}

eureka:
  client:
    service-url:
      defaultZone: ${REGISTRY_SERVICE_URL}
    fetch-registry: true
    register-with-eureka: true
    registry-fetch-interval-seconds: 30
    initial-instance-info-replication-interval-seconds: 40
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,circuitbreakerevents,metrics
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always

# ── Resilience4j Circuit Breaker / Time-Limiter ───────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        # Percentage of failures that trip the circuit
        failureRateThreshold: 50
        # Slow calls (> 2 s) also count toward the failure rate
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        # Minimum number of calls before the CB can calculate failure rate
        minimumNumberOfCalls: 5
        # How many calls are allowed in HALF_OPEN state before deciding
        permittedNumberOfCallsInHalfOpenState: 3
        # How long to stay OPEN before attempting HALF_OPEN
        waitDurationInOpenState: 10s
        # Slide-window size (COUNT_BASED)
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        # Automatically move to HALF_OPEN after waitDurationInOpenState
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Record these exceptions as failures
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        # Ignore these exceptions (don't count as failures)
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      bakongTopUpCB:
        baseConfig: default
        failureRateThreshold: 60
        slowCallDurationThreshold: 300s  # 5 minutes (don't mark as slow)
        minimumNumberOfCalls: 3
      userServiceCB:
        baseConfig: default
        slowCallDurationThreshold: 8s    # raised from 2s — DB + Railway latency can take 3-5s
        minimumNumberOfCalls: 10         # need 10 calls before tripping, not 5
        slidingWindowSize: 20            # wider window so one slow burst doesn't trip the CB
        waitDurationInOpenState: 20s     # stay open longer so the service has time to recover
      busServiceCB:
        baseConfig: default
      bakongServiceCB:
        base-config: default
      bookingServiceCB:
        baseConfig: default
        failureRateThreshold: 60
        slowCallDurationThreshold: 8s
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s             # raised from 10s — gives user-service room to breathe
        cancelRunningFuture: true
    instances:
      userServiceCB:
        timeoutDuration: 15s
        cancelRunningFuture: true
      busServiceCB:
        baseConfig: default
      bakongServiceCB:
        timeoutDuration: 300s
        cancelRunningFuture: false
      bookingServiceCB:
        timeoutDuration: 300s
        cancelRunningFuture: false

logging:
  level:
    root: INFO
    com.busapp.gatewayservice: INFO
    org.springframework.cloud.gateway: WARN
    org.springframework.cloud.gateway.filter.headers.observation: WARN
    io.github.resilience4j: INFO           # log CB state changes (OPEN/CLOSED)
    reactor.netty: WARN
    org.springframework.security: WARN
    com.netflix.discovery: WARN
    org.springframework.cloud.netflix.eureka: WARN
