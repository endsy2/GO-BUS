# ─────────────────────────────────────────────────────────────────────────────
#  API Gateway — shared settings (every environment)
#
#  Environment-specific settings live in:
#    application-dev.yml    local development  (the default profile)
#    application-prod.yml   production         (SPRING_PROFILES_ACTIVE=prod)
#
#  Routes are defined ONCE here, so dev and prod always expose the same paths.
#  Only the downstream addresses (downstream.*) change per environment.
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}

# ── CORS Configuration ─────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

spring:
  application:
    name: gateway-service
  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set (e.g. running from the IDE)
    default: dev
  data:
    redis:
      timeout: 2000ms
  cloud:
    gateway:
      # ── HTTP Client Configuration (for long-running requests) ──────────────
      httpclient:
        connect-timeout: 5000      # 5 seconds to establish connection
        response-timeout: 310s     # 5 minutes + 10s buffer for Bakong
        pool:
          type: ELASTIC
          max-connections: 500
          max-idle-time: 30s
      # Disabled automatic service discovery - using direct URLs instead
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # ── Bakong Top-Up (5-minute payment polling) ─────────────────────────
        - id: bakong-topup-service
          uri: ${downstream.user-service}
          predicates:
            - Path=/api/topups/bakong/**
          filters:
            - name: CircuitBreaker
              args:
                name: bakongServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Bakong Booking Payment (5-minute payment polling) ────────────────
        - id: bakong-booking-service
          uri: ${downstream.booking-service}
          predicates:
            - Path=/api/payments/bakong/**
          filters:
            - name: CircuitBreaker
              args:
                name: bakongServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── WebSocket Routes ────────────────────────────────────────────────
        # IMPORTANT: WebSocket routes must come BEFORE HTTP routes to match correctly

        # Bus Service WebSocket - All SockJS endpoints
        - id: bus-websocket
          uri: ${downstream.bus-service-ws}
          predicates:
            - Path=/bus-service/ws/bus/**
          filters:
            - RewritePath=/bus-service/ws/bus/(?<segment>.*), /ws/bus/$\{segment}

        # Booking Service WebSocket - All SockJS endpoints
        - id: booking-websocket
          uri: ${downstream.booking-service-ws}
          predicates:
            - Path=/booking-service/ws/booking/**
          filters:
            - RewritePath=/booking-service/ws/booking/(?<segment>.*), /ws/booking/$\{segment}

        # Admin Dashboard WebSocket
        - id: admin-dashboard-websocket
          uri: ${downstream.booking-service-ws}
          predicates:
            - Path=/admin/ws/dashboard/**
          filters:
            - RewritePath=/admin/ws/dashboard/(?<segment>.*), /ws/booking/$\{segment}

        # ── Auth (public — no JWT required) ───────────────────────────────────
        - id: auth-service
          uri: ${downstream.user-service}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Admin — User Service ───────────────────────────────────────────────
        - id: admin-user-service
          uri: ${downstream.user-service}
          predicates:
            - Path=/api/admin/users/**,/api/admin/roles/**,/api/admin/permissions/**,/api/admin/reports-customer/**,/api/admin/wallets/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── User Service ───────────────────────────────────────────────────────
        - id: user-service
          uri: ${downstream.user-service}
          predicates:
            - Path=/api/users/**,/api/wallet/**,/api/wallets/**,/api/notifications/**,/api/topups/**,/api/preferences/**,/api/profile/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Bus Service ────────────────────────────────────────────────────────
        - id: bus-service
          uri: ${downstream.bus-service}
          predicates:
            - Path=/api/buses/**,/api/routes/**,/api/layouts/**,/api/schedules/**,/api/seats/**,/api/schedule-seats/**
          filters:
            - name: CircuitBreaker
              args:
                name: busServiceCB
                fallbackUri: forward:/fallback/bus-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Admin — Bus Service ────────────────────────────────────────────────
        - id: admin-bus-service
          uri: ${downstream.bus-service}
          predicates:
            - Path=/api/admin/reports-bus/**
          filters:
            - name: CircuitBreaker
              args:
                name: busServiceCB
                fallbackUri: forward:/fallback/bus-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Admin — Booking Service ────────────────────────────────────────────
        - id: admin-booking-service
          uri: ${downstream.booking-service}
          predicates:
            - Path=/api/admin/bookings/**,/api/admin/reports-operation/**,/api/admin/financial-reports/**,/api/admin/dashboard/**,/api/admin/refunds/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Booking Service ────────────────────────────────────────────────────
        - id: booking-service
          uri: ${downstream.booking-service}
          predicates:
            - Path=/api/bookings/**,/api/payments/**,/api/tickets/**,/api/promos/**,/api/refunds/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  health:
    circuitbreakers:
      enabled: true

# ── Resilience4j Circuit Breaker / Time-Limiter ───────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        # Percentage of failures that trip the circuit
        failureRateThreshold: 50
        # Slow calls (> 2 s) also count toward the failure rate
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        # Minimum number of calls before the CB can calculate failure rate
        minimumNumberOfCalls: 5
        # How many calls are allowed in HALF_OPEN state before deciding
        permittedNumberOfCallsInHalfOpenState: 3
        # How long to stay OPEN before attempting HALF_OPEN
        waitDurationInOpenState: 10s
        # Slide-window size (COUNT_BASED)
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        # Automatically move to HALF_OPEN after waitDurationInOpenState
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Record these exceptions as failures
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        # Ignore these exceptions (don't count as failures)
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      bakongServiceCB:
        baseConfig: default
        failureRateThreshold: 60
        slowCallDurationThreshold: 300s
        minimumNumberOfCalls: 3
      userServiceCB:
        baseConfig: default
        slowCallDurationThreshold: 8s    # raised from 2s
        minimumNumberOfCalls: 10
        slidingWindowSize: 20
        waitDurationInOpenState: 20s
      busServiceCB:
        baseConfig: default
      bookingServiceCB:
        baseConfig: default
        failureRateThreshold: 60
        slowCallDurationThreshold: 8s
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s
        cancelRunningFuture: true
    instances:
      bakongServiceCB:
        timeoutDuration: 300s  # 5 minutes for payment processing (Bakong API)
        cancelRunningFuture: false
      userServiceCB:
        timeoutDuration: 15s
        cancelRunningFuture: true
      busServiceCB:
        baseConfig: default
      bookingServiceCB:
        timeoutDuration: 300s  # 5 minutes for payment processing (Bakong API)
        cancelRunningFuture: false
