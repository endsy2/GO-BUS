server:
  port: ${PORT:8080}

# ── CORS Configuration ─────────────────────────────────────────────────────────
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
  allowed-headers: ${CORS_ALLOWED_HEADERS:*}
  allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
  max-age: ${CORS_MAX_AGE:3600}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  cloud:
    gateway:
      # ── HTTP Client Configuration (for long-running requests) ──────────────
      httpclient:
        connect-timeout: 5000      # 5 seconds to establish connection
        response-timeout: 310s     # 5 minutes + 10s buffer for Bakong
        pool:
          type: ELASTIC
          max-connections: 500
          max-idle-time: 30s
      # Disabled automatic service discovery - using direct URLs instead
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      # Explicit named routes (preferred for production)
      routes:
        # ── Auth (public — no JWT required) ───────────────────────────────────
        - id: auth-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Admin — User Service ───────────────────────────────────────────────
        - id: admin-user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/admin/users/**,/api/admin/roles/**,/api/admin/permissions/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Bakong Top-Up (needs 5-minute timeout for payment processing) ──────
        - id: bakong-topup-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/wallets/top-up/bakong/**
          filters:
            - name: CircuitBreaker
              args:
                name: bakongTopUpCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3  # Don't retry long-running requests (5 min)
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE
                methods: POST
          metadata:
            response-timeout: 310000  # 5 minutes + 10 seconds (milliseconds)
            connect-timeout: 5000      # 5 seconds (milliseconds)

        # ── User Service ───────────────────────────────────────────────────────
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**,/api/wallet/**,/api/wallets/**,/api/notifications/**,/api/topups/**,/api/preferences/**,/api/profile/**
          filters:
            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # ── Bus Service ────────────────────────────────────────────────────────
        - id: bus-service
          uri: ${BUS_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/buses/**,/api/routes/**,/api/layouts/**,/api/schedules/**,/api/seats/**
          filters:
            - name: CircuitBreaker
              args:
                name: busServiceCB
                fallbackUri: forward:/fallback/bus-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
        # ── Admin — Booking Service ────────────────────────────────────────────
        - id: admin-booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/admin/bookings/**,/api/admin/reports-operation/**,/api/admin/financial-reports/**,/api/admin/dashboard/**,/api/admin/refunds/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── Booking Service ────────────────────────────────────────────────────
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/bookings/**,/api/payments/**,/api/tickets/**,/api/promos/**,/api/bakong/**
          filters:
            - name: CircuitBreaker
              args:
                name: bookingServiceCB
                fallbackUri: forward:/fallback/booking-service
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false

        # ── WebSocket Routes ────────────────────────────────────────────────
        # IMPORTANT: WebSocket routes must come BEFORE HTTP routes to match correctly
        
        # Bus Service WebSocket - All SockJS endpoints
        - id: bus-websocket
          uri: ${BUS_SERVICE_WS_URL:ws://localhost:8082}
          predicates:
            - Path=/bus-service/ws/bus/**
          filters:
            - RewritePath=/bus-service/ws/bus/(?<segment>.*), /ws/bus/$\{segment}

        # Booking Service WebSocket - All SockJS endpoints
        - id: booking-websocket
          uri: ${BOOKING_SERVICE_WS_URL:ws://localhost:8083}
          predicates:
            - Path=/booking-service/ws/booking/**
          filters:
            - RewritePath=/booking-service/ws/booking/(?<segment>.*), /ws/booking/$\{segment}

        # Admin Dashboard WebSocket
        - id: admin-dashboard-websocket
          uri: ${BOOKING_SERVICE_WS_URL:ws://localhost:8083}
          predicates:
            - Path=/admin/ws/dashboard/**
          filters:
            - RewritePath=/admin/ws/dashboard/(?<segment>.*), /ws/booking/$\{segment}
  profiles:
    active: dev


# ── JWT Configuration ──────────────────────────────────────────────────────────
# Must match jwt.public-key in user-service.
# Set JWT_PUBLIC_KEY in .env (base64-encoded DER, generated by ./generate-keys.sh)
jwt:
  public-key: ${Public_Key:""}


eureka:
  client:
    service-url:
      defaultZone: ${REGISTRY_SERVICE_URL:http://localhost:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,circuitbreakers,circuitbreakerevents,metrics
  health:
    circuitbreakers:
      enabled: true
  endpoint:
    health:
      show-details: always

# ── Resilience4j Circuit Breaker / Time-Limiter ───────────────────────────────
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        # Percentage of failures that trip the circuit
        failureRateThreshold: 50
        # Slow calls (> 2 s) also count toward the failure rate
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 2s
        # Minimum number of calls before the CB can calculate failure rate
        minimumNumberOfCalls: 5
        # How many calls are allowed in HALF_OPEN state before deciding
        permittedNumberOfCallsInHalfOpenState: 3
        # How long to stay OPEN before attempting HALF_OPEN
        waitDurationInOpenState: 10s
        # Slide-window size (COUNT_BASED)
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        # Automatically move to HALF_OPEN after waitDurationInOpenState
        automaticTransitionFromOpenToHalfOpenEnabled: true
        # Record these exceptions as failures
        recordExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - java.util.concurrent.TimeoutException
          - java.io.IOException
        # Ignore these exceptions (don't count as failures)
        ignoreExceptions:
          - org.springframework.web.client.HttpClientErrorException
    instances:
      bakongTopUpCB:
        baseConfig: default
        failureRateThreshold: 60
        slowCallDurationThreshold: 300s
        minimumNumberOfCalls: 3
      userServiceCB:
        baseConfig: default
        slowCallDurationThreshold: 8s    # raised from 2s
        minimumNumberOfCalls: 10
        slidingWindowSize: 20
        waitDurationInOpenState: 20s
      busServiceCB:
        baseConfig: default
      bookingServiceCB:
        baseConfig: default
        failureRateThreshold: 60
        slowCallDurationThreshold: 8s
  timelimiter:
    configs:
      default:
        timeoutDuration: 15s
        cancelRunningFuture: true
    instances:
      bakongTopUpCB:
        timeoutDuration: 300s
        cancelRunningFuture: false
      userServiceCB:
        timeoutDuration: 15s
        cancelRunningFuture: true
      busServiceCB:
        baseConfig: default
      bookingServiceCB:
        timeoutDuration: 300s
        cancelRunningFuture: false

logging:
  level:
    root: INFO
    com.busapp.gatewayservice: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.handler: DEBUG
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    # Suppress Micrometer observation span noise (http.status_code='UNKNOWN' is a
    # known SCG 4.1.x bug — status tag is unset at span-creation time; not a real error)
    org.springframework.cloud.gateway.filter.headers.observation: WARN
    reactor.netty: DEBUG
