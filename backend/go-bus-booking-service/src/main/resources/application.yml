# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC

external:
  bus-service:
    url: ${BUS-SERVICE-URL:http://localhost:8082}
    path: ${BUS-SERVICE-PATH:/api}
  user-service:
    url: ${USER-SERVICE-URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.busapp.bookingservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
    org.springframework.amqp: DEBUG
    org.hibernate.SQL: DEBUG
