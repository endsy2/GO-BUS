server:
  port: ${PORT:8082}

spring:
  application:
    name: booking-service
  profiles:
    active: dev
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
#    url: jdbc:postgresql://${POSTGRES_HOST:ep-dry-flower-a1e2sv79-pooler.ap-southeast-1.aws.neon.tech}:${POSTGRES_PORT:5432}/${POSTGRES_DB:neondb}?sslmode=${PGSSLMODE:require}&sslchannelbinding=${PGCHANNELBINDING:require}
#    driver-class-name: org.postgresql.Driver
#    username: ${POSTGRES_USER:neondb_owner}
#    password: ${POSTGRES_PASSWORD:npg_MLKJPNA8nEu2}
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:busbooking}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true #create database schema if it not exist
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: booking_service
  
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8          # max simultaneous connections
          max-idle: 8            # max idle connections kept in pool
          min-idle: 2            # min idle connections (keep-warm)
          max-wait: -1ms         # block indefinitely waiting for connection (-1 = no limit)
        shutdown-timeout: 2s    # how long to wait for in-flight commands on shutdown
  
  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false
        acknowledge-mode: auto

