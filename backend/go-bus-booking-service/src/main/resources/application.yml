# ─────────────────────────────────────────────────────────────────────────────
#  Booking Service — shared settings (every environment)
#
#  Environment-specific settings live in:
#    application-dev.yml    local development  (the default profile)
#    application-prod.yml   production         (SPRING_PROFILES_ACTIVE=prod)
#
#  Never put passwords, tokens or keys in this file.
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8083}

spring:
  application:
    name: booking-service
  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set (e.g. running from the IDE)
    default: dev
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # "update" lets Hibernate create/alter tables on startup. Override with
      # JPA_DDL_AUTO=validate once the schema is managed by migrations.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true #create database schema if it not exist
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: booking_service

  # Redis Configuration
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8          # max simultaneous connections
          max-idle: 8            # max idle connections kept in pool
          min-idle: 2            # min idle connections (keep-warm)
          max-wait: -1ms         # block indefinitely waiting for connection (-1 = no limit)
        shutdown-timeout: 2s    # how long to wait for in-flight commands on shutdown

  # RabbitMQ Configuration
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3000
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false
        acknowledge-mode: auto

# ── Bakong KHQR ────────────────────────────────────────────────────────────────
bakong:
  pollingIntervalMs: ${BAKONG_POLLING_INTERVAL_MS:2000}
  connectionTimeout: ${BAKONG_CONNECTION_TIMEOUT_MS:300000}

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC

external:
  bus-service:
    path: ${BUS_SERVICE_PATH:/api}

management:
  endpoints:
    web:
      exposure:
        include: health,info
