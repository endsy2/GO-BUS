# ─────────────────────────────────────────────────────────────────────────────
#  User Service — DEVELOPMENT profile (active by default)
#
#  Every value has a localhost default that matches docker-compose.dev.yml, so
#  the service runs from the IDE with no setup. Override any value with an
#  environment variable of the same name.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:busbooking}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# ── MinIO Configuration ────────────────────────────────────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # Public, browser-reachable endpoint used ONLY for generating presigned URLs.
  # Presigned URLs are loaded directly by the browser (not via the gateway), and
  # the host is part of the SigV4 signature — so it must be signed with the host
  # the browser will actually hit.
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:busapp-profiles}

# ── Bakong KHQR (merchant details are printed on every QR, so not secret) ─────
bakong:
  account-id: ${BAKONG_ACCOUNT_ID:chin_kongming@aclb}
  acquiring-bank: ${ACQUIRINGBANK:chin_kongming@aclb}
  merchant-name: ${MERCHANTNAME:CHIN KONG MING}
  mobile-number: ${MOBILENUMBERSTORELABEL:85581362035}
  store-label: ${STORELABEL:BusBooking}
  base-url: ${BAKONG_BASE_URL:http://208.122.28.97:8000}
  email: ${EMAIL:kongming434@gmail.com}

# ── JWT Configuration ──────────────────────────────────────────────────────────
# DEV-ONLY key pair. It is public (committed to git), so it must NEVER be used
# in production. The public key matches gateway-service/application-dev.yml.
jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}

# ── Default admin account (created on first start if it does not exist) ───────
app:
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:admin123}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Service URLs
booking:
  service:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.busapp.userservice: DEBUG
    org.springframework.web: INFO
    org.springframework.data.jpa: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG          # still shows queries
    org.hibernate.type.descriptor.sql.BasicBinder: WARN   # was TRACE — logged every param value, huge overhead
