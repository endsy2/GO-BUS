server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:busbooking}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 60000
      pool-name: UserServicePool
      connection-init-sql: "SET search_path TO user_service"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        hbm2ddl:
          create_namespaces: true #create database schema if it not exist
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: user_service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8          # max simultaneous connections
          max-idle: 8            # max idle connections kept in pool
          min-idle: 2            # min idle connections (keep-warm)
          max-wait: -1ms         # block indefinitely waiting for connection (-1 = no limit)
        shutdown-timeout: 2s    # how long to wait for in-flight commands on shutdown

# ── MinIO Configuration ────────────────────────────────────────────────────────
minio:
  # Internal endpoint for server-side I/O (upload/delete) over Railway's private network.
  endpoint: ${MINIO_ENDPOINT:http://bucket.railway.internal:9000}
  # Public, browser-reachable endpoint used ONLY to sign presigned URLs. The signed host
  # is part of the SigV4 signature, so it MUST be the host the browser actually loads from —
  # never the *.railway.internal address (browsers can't resolve it).
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:https://bucket-production-968b.up.railway.app}
  access-key: ${MINIO_ACCESS_KEY:Ibc7VidQNVyjs5O6BTSofAJZwipsVj5b}
  secret-key: ${MINIO_SECRET_KEY:zRj2DOKqYGtz3nn8yVtCh6rSb1QQAhv5uw0xJYlrBjZaOW01}
  bucket-name: ${MINIO_BUCKET_NAME:go-bus-bucket}
  # Explicit region so the SDK signs presigned URLs locally instead of making a
  # GetBucketLocation network probe to the public endpoint — that probe fails from
  # inside Railway's private network (can't hairpin to its own public domain) and
  # was causing getPresignedUrl() to return null.
  region: ${MINIO_REGION:us-east-1}

# ── Bakong Configuration ───────────────────────────────────────────────────────
bakong:
  account-id : ${BAKONG_ACCOUNT_ID}
  acquiring-bank : ${ACQUIRINGBANK}
  merchant-name : ${MERCHANTNAME}
  mobile-number : ${MOBILENUMBERSTORELABEL}
  store-label : ${STORELABEL}
  baseUrl : ${BAKONG_BASE_URL}
  email : ${EMAIL}
  pollingIntervalMs: ${POLL_INTERVAL}
  connectionTimeout : ${TIME_OUT}

# ── JWT Configuration ──────────────────────────────────────────────────────────
# Provide base64-encoded DER keys (generated by ./generate-keys.sh).
# Leave blank to auto-generate ephemeral keys (development only).
jwt:

  private-key: ${JWT_PRIVATE_KEY}
  public-key:  ${JWT_PUBLIC_KEY}
  access-token-expiry:  ${JWT_ACCESS_EXPIRY:900000}     # 15 minutes in ms
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000} # 7 days in ms

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_BASE_URL}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC

# Service URLs
booking:
  service:
    url: ${BUS_SERVICE_BASE_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.busapp.userservice: INFO
    org.springframework.web: WARN
    org.springframework.data.jpa: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN