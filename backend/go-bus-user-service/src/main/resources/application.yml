# ─────────────────────────────────────────────────────────────────────────────
#  User Service — shared settings (every environment)
#
#  Environment-specific settings live in:
#    application-dev.yml    local development  (the default profile)
#    application-prod.yml   production         (SPRING_PROFILES_ACTIVE=prod)
#
#  Never put passwords, tokens or keys in this file.
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8081}

spring:
  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set (e.g. running from the IDE)
    default: dev
  application:
    name: user-service
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20        # up from default 10 — handles bursts of admin queries
      minimum-idle: 5              # keep 5 warm connections always ready
      connection-timeout: 30000    # 30s max wait for a connection from pool
      idle-timeout: 600000         # 10 min — close idle connections above min-idle
      max-lifetime: 1800000        # 30 min — recycle connections to avoid stale ones
      keepalive-time: 60000        # 1 min heartbeat ping to Railway's proxy
      pool-name: UserServicePool
      # Set search_path on every new connection so JdbcTemplate native SQL
      # can reference tables without schema prefix (same as Hibernate default_schema)
      connection-init-sql: "SET search_path TO user_service"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # "update" lets Hibernate create/alter tables on startup. Override with
      # JPA_DDL_AUTO=validate once the schema is managed by migrations.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true #create database schema if it not exist
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: user_service
  data:
    redis:
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8          # max simultaneous connections
          max-idle: 8            # max idle connections kept in pool
          min-idle: 2            # min idle connections (keep-warm)
          max-wait: -1ms         # block indefinitely waiting for connection (-1 = no limit)
        shutdown-timeout: 2s    # how long to wait for in-flight commands on shutdown

# ── MinIO Configuration ────────────────────────────────────────────────────────
minio:
  # Explicit region so presigned URLs are signed locally without a network
  # GetBucketLocation probe.
  region: ${MINIO_REGION:us-east-1}

# ── Bakong KHQR ────────────────────────────────────────────────────────────────
bakong:
  pollingIntervalMs: ${BAKONG_POLLING_INTERVAL_MS:2000}
  connectionTimeout: ${BAKONG_CONNECTION_TIMEOUT_MS:300000}

# ── JWT Configuration ──────────────────────────────────────────────────────────
# The RS256 key pair itself is set per environment (see application-dev/prod.yml).
jwt:
  access-token-expiry:  ${JWT_ACCESS_EXPIRY:900000}     # 15 minutes in ms
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000} # 7 days in ms

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC

management:
  endpoints:
    web:
      exposure:
        include: health,info
