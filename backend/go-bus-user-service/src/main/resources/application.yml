server:
  port: 8081

spring:
  profiles:
    active: dev
  application:
    name: user-service
  datasource:
#    url: jdbc:postgresql://${POSTGRES_HOST:ep-dry-flower-a1e2sv79-pooler.ap-southeast-1.aws.neon.tech}:${POSTGRES_PORT:5432}/${POSTGRES_DB:neondb}?sslmode=${PGSSLMODE:require}&sslchannelbinding=${PGCHANNELBINDING:require}
#    driver-class-name: org.postgresql.Driver
#    username: ${POSTGRES_USER:neondb_owner}
#    password: ${POSTGRES_PASSWORD:npg_MLKJPNA8nEu2}
    url: jdbc:postgresql://${POSTGRES_HOST:yamabiko.proxy.rlwy.net}:${POSTGRES_PORT:54188}/${POSTGRES_DB:railway}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:mHKXnSqKeHzmLEpoVvmeVnUETNvBlGfO}
    hikari:
      maximum-pool-size: 20        # up from default 10 — handles bursts of admin queries
      minimum-idle: 5              # keep 5 warm connections always ready
      connection-timeout: 30000    # 30s max wait for a connection from pool
      idle-timeout: 600000         # 10 min — close idle connections above min-idle
      max-lifetime: 1800000        # 30 min — recycle connections to avoid stale ones
      keepalive-time: 60000        # 1 min heartbeat ping to Railway's proxy
      pool-name: UserServicePool
      # Set search_path on every new connection so JdbcTemplate native SQL
      # can reference tables without schema prefix (same as Hibernate default_schema)
      connection-init-sql: "SET search_path TO user_service"
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        hbm2ddl:
          create_namespaces: true #create database schema if it not exist
        jdbc:
          lob:
            non_contextual_creation: true
        default_schema: user_service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8          # max simultaneous connections
          max-idle: 8            # max idle connections kept in pool
          min-idle: 2            # min idle connections (keep-warm)
          max-wait: -1ms         # block indefinitely waiting for connection (-1 = no limit)
        shutdown-timeout: 2s    # how long to wait for in-flight commands on shutdown

# ── MinIO Configuration ────────────────────────────────────────────────────────
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  # Public, browser-reachable endpoint used ONLY for generating presigned URLs.
  # Presigned URLs are loaded directly by the browser (not via the gateway), and
  # the host is part of the SigV4 signature — so it must be signed with the host
  # the browser will actually hit. Falls back to the internal endpoint for local
  # dev where they're the same.
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket-name: ${MINIO_BUCKET_NAME:busapp-profiles}
  # Explicit region so presigned URLs are signed locally without a network
  # GetBucketLocation probe (see application-prod.yml for the prod rationale).
  region: ${MINIO_REGION:us-east-1}

# ── JWT Configuration ──────────────────────────────────────────────────────────
# Provide base64-encoded DER keys (generated by ./generate-keys.sh).
# Leave blank to auto-generate ephemeral keys (development only).
jwt:
  private-key: ""
#  private-key: ${JWT_PRIVATE_KEY:""}
#  public-key:  ${JWT_PUBLIC_KEY:}
  public-key: ""
  access-token-expiry:  ${JWT_ACCESS_EXPIRY:900000}     # 15 minutes in ms
  refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800000} # 7 days in ms

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC

# Service URLs
booking:
  service:
    url: http://${BOOKING_SERVICE_HOST:localhost}:${BOOKING_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    com.busapp.userservice: DEBUG
    org.springframework.web: INFO
    org.springframework.data.jpa: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG          # still shows queries
    org.hibernate.type.descriptor.sql.BasicBinder: WARN   # was TRACE — logged every param value, huge overhead