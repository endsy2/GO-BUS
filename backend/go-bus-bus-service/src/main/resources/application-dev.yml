# ─────────────────────────────────────────────────────────────────────────────
#  Bus Service — DEVELOPMENT profile (active by default)
#
#  Every value has a localhost default that matches docker-compose.dev.yml, so
#  the service runs from the IDE with no setup. Override any value with an
#  environment variable of the same name.
# ─────────────────────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:busbooking}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  jpa:
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

# Service URLs
booking:
  service:
    url: ${BOOKING_SERVICE_URL:http://localhost:8083}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.busapp.busservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.jpa: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: WARN   # was TRACE — logged every bound param value (sensitive data + overhead)
