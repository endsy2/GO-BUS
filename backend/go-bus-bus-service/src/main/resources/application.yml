# ─────────────────────────────────────────────────────────────────────────────
#  Bus Service — shared settings (every environment)
#
#  Environment-specific settings live in:
#    application-dev.yml    local development  (the default profile)
#    application-prod.yml   production         (SPRING_PROFILES_ACTIVE=prod)
#
#  Never put passwords, tokens or keys in this file.
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8082}

spring:
  application:
    name: bus-service
  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set (e.g. running from the IDE)
    default: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # "update" lets Hibernate create/alter tables on startup. Override with
      # JPA_DDL_AUTO=validate once the schema is managed by migrations.
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
        hbm2ddl:
          create_namespaces: true
        default_schema: bus_service

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

# Feign client configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: BASIC

management:
  endpoints:
    web:
      exposure:
        include: health,info

# ── Seat Selection Configuration ──────────────────────────────────────────────
seat:
  selection:
    timeout-minutes: 5  # Auto-release pending seats after 5 minutes
