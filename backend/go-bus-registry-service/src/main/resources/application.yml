# ─────────────────────────────────────────────────────────────────────────────
#  Eureka Server — shared settings (every environment)
#
#  Environment-specific settings live in:
#    application-dev.yml    local development  (the default profile)
#    application-prod.yml   production         (SPRING_PROFILES_ACTIVE=prod)
# ─────────────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8761}

spring:
  application:
    name: eureka-server
  profiles:
    # Used only when SPRING_PROFILES_ACTIVE is not set (e.g. running from the IDE)
    default: dev

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
