# ─────────────────────────────────────────────────────────────────────────────
#  Go Bus Express — PRODUCTION environment (single server / VPS)
#
#  Brings up the FULL stack:
#    infra (postgres · redis · rabbitmq · minio)
#    eureka · user · bus · booking · gateway
#    admin frontend (React, served by `serve`)
#    nginx reverse proxy  ->  the single entry point (container port 80)
#
#  Everything else is reachable only inside the docker network, except a few
#  admin ports bound to 127.0.0.1 (reach them through an SSH tunnel, never
#  exposed to the internet).
#
#  nginx publishes no host port, because on Dokploy the host's ports 80/443
#  belong to Dokploy's Traefik proxy (binding 80 fails: "port is already
#  allocated").
#
#  Deploy with Dokploy:
#      Domains tab -> Add Domain -> service: nginx, container port: 80
#      (Traefik routes the domain to nginx and can issue the HTTPS certificate)
#
#  Deploy on a plain server without Dokploy (run from the repo root):
#      cp .env.prod.example .env.prod
#      # fill in .env.prod  (passwords, JWT keys, public IP / domain)
#      # and add  ports: ["80:80"]  to the nginx service below
#      docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
#  Required secrets use ${VAR:?message}: if one is missing, compose refuses to
#  start and prints the message, instead of deploying with a weak default.
#
#  Then open your domain (Dokploy) or http://<YOUR_SERVER_IP>/ (plain server).
# ─────────────────────────────────────────────────────────────────────────────

# Settings shared by every Spring Boot service (merged in with "<<:")
x-spring-env: &spring-env
  SPRING_PROFILES_ACTIVE: prod
  EUREKA_URL: http://eureka-server:8761/eureka/

x-db-env: &db-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_DB: ${POSTGRES_DB:-busbooking}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
  # The bundled postgres container has no TLS. Use require for a managed DB.
  PGSSLMODE: disable

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    container_name: busapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-busbooking}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.prod}
    ports:
      - "127.0.0.1:5432:5432"     # localhost-only (SSH tunnel for admin access)
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - busapp-net

  redis:
    image: redis:7-alpine
    container_name: busapp-redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass "$$REDIS_PASSWORD"
        else
          redis-server
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - busapp-net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: busapp-rabbitmq
    restart: unless-stopped
    hostname: rabbitmq
    ports:
      - "127.0.0.1:15672:15672"   # management UI, localhost-only
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-busapp}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.prod}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - busapp-net

  minio:
    # minio/minio was deleted from Docker Hub in Sept 2026. pgsty/minio is a
    # community fork built from the same source (same CLI, /data volume and mc).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: busapp-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9001:9001"     # console, localhost-only
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-busapp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD (8+ characters) in .env.prod}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - busapp-net

  # ── Service Discovery ───────────────────────────────────────────────────────

  eureka-server:
    build:
      context: ./backend/go-bus-registry-service
    container_name: busapp-eureka
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - busapp-net

  # ── Microservices ───────────────────────────────────────────────────────────

  user-service:
    build:
      context: ./backend/go-bus-user-service
    container_name: busapp-user
    restart: unless-stopped
    environment:
      <<: [*spring-env, *db-env]
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?Set JWT_PRIVATE_KEY in .env.prod (run backend/generate-keys.sh)}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY in .env.prod (run backend/generate-keys.sh)}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-900000}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800000}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:?Set ADMIN_DEFAULT_PASSWORD in .env.prod}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-busapp}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env.prod}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-busapp-profiles}
      BOOKING_SERVICE_URL: http://booking-service:8083
      BAKONG_ACCOUNT_ID: ${BAKONG_ACCOUNT_ID:-}
      ACQUIRINGBANK: ${ACQUIRINGBANK:-}
      MERCHANTNAME: ${MERCHANTNAME:-}
      MOBILENUMBERSTORELABEL: ${MOBILENUMBERSTORELABEL:-}
      STORELABEL: ${STORELABEL:-}
      BAKONG_BASE_URL: ${BAKONG_BASE_URL:-}
      EMAIL: ${EMAIL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - busapp-net

  bus-service:
    build:
      context: ./backend/go-bus-bus-service
    container_name: busapp-bus
    restart: unless-stopped
    environment:
      <<: [*spring-env, *db-env]
      BOOKING_SERVICE_URL: http://booking-service:8083
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - busapp-net

  booking-service:
    build:
      context: ./backend/go-bus-booking-service
    container_name: busapp-booking
    restart: unless-stopped
    environment:
      <<: [*spring-env, *db-env]
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-busapp}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env.prod}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      USER_SERVICE_URL: http://user-service:8081
      BUS_SERVICE_URL: http://bus-service:8082
      BAKONG_ACCOUNT_ID: ${BAKONG_ACCOUNT_ID:-}
      ACQUIRINGBANK: ${ACQUIRINGBANK:-}
      MERCHANTNAME: ${MERCHANTNAME:-}
      MOBILENUMBERSTORELABEL: ${MOBILENUMBERSTORELABEL:-}
      STORELABEL: ${STORELABEL:-}
      BAKONG_BASE_URL: ${BAKONG_BASE_URL:-}
      EMAIL: ${EMAIL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - busapp-net

  # ── API Gateway ─────────────────────────────────────────────────────────────

  gateway-service:
    build:
      context: ./backend/go-bus-gateway-service
    container_name: busapp-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"     # localhost-only; public access is via nginx
    environment:
      <<: *spring-env
      # Downstream service URLs (gateway uses direct URLs, not Eureka lookup)
      USER_SERVICE_URL: http://user-service:8081
      BUS_SERVICE_URL: http://bus-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      BUS_SERVICE_WS_URL: ws://bus-service:8082
      BOOKING_SERVICE_WS_URL: ws://booking-service:8083
      # Redis (token blacklist + rate limiting)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?Set JWT_PUBLIC_KEY in .env.prod (run backend/generate-keys.sh)}
      # CORS — single-origin via nginx means no cross-origin calls, but keep open
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      user-service:
        condition: service_healthy
      bus-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - busapp-net

  # ── Admin Frontend (React, built into a static bundle, served by `serve`) ────

  admin-frontend:
    build:
      context: "./admin frontend/go-bus-admin"
      args:
        # Baked into the React bundle at build time. MUST point at this server.
        REACT_APP_BASE_URL: ${REACT_APP_BASE_URL:?Set REACT_APP_BASE_URL in .env.prod}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL:?Set REACT_APP_WS_URL in .env.prod}
    container_name: busapp-admin
    restart: unless-stopped
    networks:
      - busapp-net

  # ── Reverse Proxy (the single entry point; see the header for exposure) ─────

  nginx:
    image: nginx:1.27-alpine
    container_name: busapp-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway-service
      - admin-frontend
    networks:
      - busapp-net

# ── Volumes & Networks ────────────────────────────────────────────────────────

volumes:
  postgres-data:
    driver: local
  rabbitmq-data:
    driver: local
  minio-data:
    driver: local

networks:
  busapp-net:
    driver: bridge
